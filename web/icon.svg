<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #111; }
    .fg { fill: #fff; stroke: #fff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #fff; }
      .fg { fill: #111; stroke: #111; }
    }
  </style>
  <defs>
    <clipPath id="a"><circle cx="13.2" cy="13.2" r="7.2"/></clipPath>
  </defs>
  <rect class="bg" width="32" height="32" rx="8"/>
  <g class="fg">
    <circle cx="18.8" cy="18.8" r="7.2" stroke="none" clip-path="url(#a)"/>
    <circle cx="13.2" cy="13.2" r="7.2" fill="none" stroke-width="2.2"/>
    <circle cx="18.8" cy="18.8" r="7.2" fill="none" stroke-width="2.2"/>
  </g>
</svg>
